<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Primer PICKR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        button, input, textarea { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Navbar to be used in all templates (index.html, about.html, etc.) -->
  <nav class="bg-white shadow-sm sticky top-0 z-20">
      <div class="container mx-auto px-4 sm:px-6">
          <div class="flex justify-between items-center py-4">
              <a href="{% url 'home' %}" class="flex items-center space-x-2 text-gray-800 hover:text-blue-600 transition">
                  <i class="fas fa-dna text-blue-600 text-2xl"></i>
                  <h1 class="text-2xl font-bold">Primer PICKR</h1>
              </a>
              <div class="hidden md:flex items-center space-x-4">
                    <a href="{% url 'about' %}" class="text-gray-600 hover:text-blue-600">About</a>
                    <a href="{% url 'how' %}" class="text-gray-600 hover:text-blue-600">How to use PICKR</a>
                    <a href="{% url 'api_docs' %}" class="text-gray-600 hover:text-blue-600">API</a>
                    <a href="{% url 'contact' %}" class="text-gray-600 hover:text-blue-600">Contact</a>
              </div>
          </div>
      </div>
  </nav>

    <!-- Main Content -->
    <main class="container mx-auto max-w-screen-xl px-4 sm:px-6 py-12">
        <div class="max-w-3xl mx-auto">
            <header class="text-center mb-10">
                <h2 class="text-4xl font-bold text-gray-800">Get in Touch</h2>
                <p class="text-gray-600 mt-2 text-lg">We'd love to hear from you with questions, feedback, or suggestions.</p>
            </header>

            <div id="contact-form-container" class="bg-white rounded-xl shadow-lg p-8">
                <form id="contact-form" method="POST">
                    {% csrf_token %}
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
                            <input type="text" name="name" id="name" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                            <input type="email" name="email" id="email" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        </div>
                    </div>
                    <div class="mt-6">
                        <label for="subject" class="block text-sm font-medium text-gray-700">Subject</label>
                        <input type="text" name="subject" id="subject" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    </div>
                    <div class="mt-6">
                        <label for="message" class="block text-sm font-medium text-gray-700">Message</label>
                        <textarea id="message" name="message" rows="5" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
                    </div>
                    <div class="mt-8 text-right">
                        <button id="submit-btn" type="submit" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg">
                            Send Message
                        </button>
                    </div>
                </form>
            </div>
             <div id="response-message" class="hidden p-6 rounded-xl shadow-lg mt-8" role="alert">
                <p id="response-title" class="font-bold"></p>
                <p id="response-body"></p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white mt-16 py-8 border-t">
        <div class="container mx-auto px-4 sm:px-6 text-center text-gray-500">
            <p>&copy; 2025 Primer PICKR. All rights reserved.</p>
            <p class="text-sm">Data sourced from PubMed. Not for clinical use.</p>
        </div>
    </footer>

    <script>
        const contactForm = document.getElementById('contact-form');
        const formContainer = document.getElementById('contact-form-container');
        const responseMessage = document.getElementById('response-message');
        const responseTitle = document.getElementById('response-title');
        const responseBody = document.getElementById('response-body');
        const submitBtn = document.getElementById('submit-btn');

        contactForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            const originalBtnText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

            const formData = new FormData(contactForm);
            let isSuccess = false;

            try {
                const response = await fetch("{% url 'contact' %}", {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': formData.get('csrfmiddlewaretoken'),
                    },
                });

                const result = await response.json();

                if (response.ok) {
                    isSuccess = true;
                    formContainer.classList.add('hidden');
                    responseTitle.textContent = 'Message Sent!';
                    responseBody.textContent = result.message;
                    responseMessage.className = 'block bg-green-100 border-l-4 border-green-500 text-green-700 p-6 rounded-xl shadow-lg mt-8';
                } else {
                    throw new Error(result.message || 'An unknown error occurred.');
                }

            } catch (error) {
                responseTitle.textContent = 'Error!';
                responseBody.textContent = error.message;
                responseMessage.className = 'block bg-red-100 border-l-4 border-red-500 text-red-700 p-6 rounded-xl shadow-lg mt-8';
            } finally {
                 responseMessage.classList.remove('hidden');
                 if(!isSuccess) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnText;
                 }
            }
        });
    </script>

</body>
</html>
